name:                haskclaw
version:             0.1.0.0
github:              "eunmin/haskclaw"
license:             MIT
author:              "Eunmin Kim"
maintainer:          "telepopsound@gmail.com"
copyright:           "2026 Eunmin Kim"

extra-source-files:
- README.md
- CHANGELOG.md

description:         Telegram ↔ Claude Code bridge bot

dependencies:
- base >= 4.7 && < 5
- relude
- aeson
- text
- http-client
- http-client-tls
- effectful
- effectful-th
- bytestring
- http-types
- stm
- containers
- typed-process
- directory
- filepath
- time
- cron
- random

default-extensions:
- ConstraintKinds
- DataKinds
- FlexibleContexts
- FlexibleInstances
- MultiParamTypeClasses
- GADTs
- TemplateHaskell
- TypeFamilies
- TypeOperators
- DeriveGeneric
- DeriveAnyClass
- DerivingStrategies
- GeneralizedNewtypeDeriving
- InstanceSigs
- KindSignatures
- LambdaCase
- OverloadedStrings
- RecordWildCards
- ScopedTypeVariables
- StandaloneDeriving
- TupleSections
- TypeApplications
- ViewPatterns
- NoImplicitPrelude
- StrictData
- DuplicateRecordFields
- OverloadedRecordDot
- QuasiQuotes

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  haskclaw-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - haskclaw
  haskclaw-mcp:
    main:                Main.hs
    source-dirs:         mcp
    ghc-options:
    - -threaded
    - -rtsopts
    dependencies:
    - haskclaw

tests:
  haskclaw-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    build-tools:
    - hspec-discover
    dependencies:
    - haskclaw
    - hspec
    - effectful
    - containers
    - directory
    - filepath
